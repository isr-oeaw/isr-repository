{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f7f9fc;
            font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #0b0b0b;
            -webkit-text-size-adjust: 100%;
        }
        table {
            border-collapse: collapse;
        }
        .btn {
            display: inline-block;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            border-radius: 10px;
            text-align: center;
            background-color: #0047BB;
            color: #ffffff;
        }
        .card {
            background-color: #eef3fa;
            border: 1px solid #dce4ef;
            border-radius: 14px;
            padding: 20px;
            margin: 20px 0;
        }
        .info-box {
            background-color: #eef3fa;
            border-left: 4px solid #0047BB;
            padding: 16px 20px;
            margin: 20px 0;
            border-radius: 0 14px 14px 0;
        }
        .notice {
            background-color: #eef3fa;
            border-left: 4px solid #8a8984;
            padding: 16px 20px;
            margin: 20px 0;
            border-radius: 0 14px 14px 0;
            color: #52514e;
        }
        .meta {
            color: #52514e;
            font-size: 14px;
        }
        .email-title {
            margin: 0 0 24px 0;
            font-size: 22px;
            font-weight: 650;
            color: #001A70;
            letter-spacing: -0.02em;
            line-height: 1.3;
        }
        h1, h2, h3 {
            color: #001A70;
        }
        a {
            color: #0047BB;
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f7f9fc;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f7f9fc;">
        <tr>
            <td align="center" style="padding: 32px 16px;">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width: 600px; width: 100%; background-color: #ffffff; border: 1px solid #dce4ef; border-radius: 14px;">
                    <!-- Header -->
                    <tr>
                        <td style="padding: 24px 32px 20px 32px; text-align: left; border-bottom: 1px solid #dce4ef;">
                            <p style="margin: 0; font-size: 18px; font-weight: 650; color: #001A70; letter-spacing: -0.02em;">
                                {{ site_name|default:"ISR Repository" }}
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="background-color: #92C1E9; height: 4px; font-size: 0; line-height: 0;">&nbsp;</td>
                    </tr>
                    <!-- Content -->
                    <tr>
                        <td style="padding: 32px; color: #0b0b0b; font-size: 16px; line-height: 1.6;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td style="padding: 20px 32px 28px 32px; text-align: center; border-top: 1px solid #dce4ef;">
                            <p style="margin: 0 0 8px 0; font-size: 12px; color: #8a8984;">
                                {% trans "This is an automated message, please do not reply to this email." %}
                            </p>
                            <p style="margin: 0; font-size: 12px; color: #8a8984;">
                                {{ site_name|default:"ISR Repository" }}
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
